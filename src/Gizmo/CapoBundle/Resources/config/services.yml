parameters:
#    gizmo_capo.example.class: Gizmo\CapoBundle\Example

services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    LdapTools\Bundle\LdapToolsBundle\Security\User\LdapUserProvider: '@ldap_tools.security.user.ldap_user_provider'

    Gizmo\CapoBundle\:
        resource: '../../*'
        exclude: '../../{Entity,Event,Model,Repository}'

    Gizmo\CapoBundle\Event\LoadUserEventListener:
        autowire: false
        tags:
            - { name: kernel.event_listener, event: ldap_tools_bundle.load_user.before, method: beforeLoadUser }
            - { name: kernel.event_listener, event: ldap_tools_bundle.load_user.after, method: afterLoadUser }

    Gizmo\CapoBundle\Event\LoginEventListener:
        autowire: false
        arguments: ['@doctrine.orm.entity_manager', '@ldap_tools.security.user.ldap_user_provider']
        tags:
            - { name: kernel.event_listener, event: ldap_tools_bundle.login.success, method: onLoginSuccess }

    Gizmo\CapoBundle\Services\EventLogService:
        autowire: false
        arguments: ['@security.token_storage', '@doctrine', '%enable_eventlog%']
        tags:
            - { name: 'kernel.event_listener', event: 'security.interactive_login' }

    Gizmo\CapoBundle\Services\PDFService:
        autowire: false
        calls:
            - [ setTitle, [ 'Capo PDF Export', true ] ]
            - [ setLogoPath, [ "Resources/public/images/logo.png" ] ]
